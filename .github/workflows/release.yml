name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must be semantic versions without a prefix."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be reachable from main."
            exit 1
          fi

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Package
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          archive="$(./scripts/package.sh "$RUNNER_TEMP/dist")"
          if [[ "$(basename "$archive")" != "migr-${TAG}-macos.tar.gz" ]]; then
            echo "Built $(basename "$archive"), which does not match release tag $TAG."
            exit 1
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Create commit-list release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(
            git tag --merged "${TAG}^" --sort=-version:refname --list |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n 1 || true
          )"

          {
            echo "## Changes"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --pretty='- %s (`%h`)' "${previous_tag}..${TAG}"
            else
              git log --pretty='- %s (`%h`)' "$TAG"
            fi
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  homebrew-tap:
    needs: release
    uses: ./.github/workflows/tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
