name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - COPYRIGHT
      - LICENSE
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - COPYRIGHT
      - LICENSE

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Package
        run: ./scripts/package.sh "$RUNNER_TEMP/dist"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/dist/*.tar.gz
          archive: false
          retention-days: 5
